---
- name: Create the env file directory
  ansible.builtin.file:
    path: "{{ hindsight_env_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write the env file
  ansible.builtin.template:
    src: hindsight.env.j2
    dest: "{{ hindsight_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart hindsight
