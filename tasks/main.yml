---
- name: Validate the role input
  ansible.builtin.import_tasks:
    file: validate.yml

- name: Install the container runtime and the Hindsight image
  ansible.builtin.import_tasks:
    file: install.yml

- name: Write the Hindsight configuration
  ansible.builtin.import_tasks:
    file: config.yml

- name: Prepare the host data directory
  ansible.builtin.import_tasks:
    file: data-dir.yml

- name: Run Hindsight under systemd
  ansible.builtin.import_tasks:
    file: service.yml
