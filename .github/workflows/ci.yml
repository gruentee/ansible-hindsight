---
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (prek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      # The key includes the recorded linter commit, so bumping
      # .ansible-lint-but-fast-rev rebuilds the tool.
      - name: Cache linter build
        id: lint-cache
        uses: actions/cache@v4.2.0
        with:
          path: ~/.lint-tool
          key: ansible-lint-but-fast-${{ runner.os }}-${{ hashFiles('.ansible-lint-but-fast-rev') }}

      - name: Build linter at the pinned commit
        if: steps.lint-cache.outputs.cache-hit != 'true'
        run: scripts/install-lint-tool.sh --root "$HOME/.lint-tool"

      - name: Add linter to PATH
        run: echo "$HOME/.lint-tool/bin" >> "$GITHUB_PATH"

      - name: Install prek and yamllint
        run: |
          pipx install prek
          pipx install yamllint

      # The same definition the local hooks use.
      - name: Run hooks
        run: prek run --all-files

  molecule:
    name: Molecule (default, Ubuntu 26.04)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2

      # The full image is several GB; free runner disk before it is pulled.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Install Molecule
        run: |
          pipx install molecule
          pipx inject molecule "molecule-plugins[docker]"

      # The scenario also runs the check-mode guarantees (#17) before and after the converge.
      - name: Check mode, converge, idempotence, check mode, verify
        run: molecule test -s default
