---
# Network scenario (#13): non-default bind address, ports, access key and pass-through on Ubuntu 26.04, rootful Podman nested in a systemd container.
# The platforms block follows docs/adr/0001-molecule-with-nested-podman.md.
driver:
  name: docker
platforms:
  - name: ubuntu-2604-net
    image: ubuntu:26.04
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        hindsight_llm_provider: none
        hindsight_cp_access_key: molecule-secret-sentinel
        hindsight_min_free_disk_mb: 0
        hindsight_bind_address: 127.0.0.2
        hindsight_api_port: 18888
        hindsight_cp_port: 19999
        hindsight_extra_env:
          HINDSIGHT_API_LOG_LEVEL: debug
          HINDSIGHT_API_WORKER_ID: extra-env-sentinel
verifier:
  name: ansible
