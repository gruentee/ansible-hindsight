---
# Spike (#10): privileged systemd container on Ubuntu 26.04 that runs rootful Podman inside.
driver:
  name: docker
platforms:
  - name: ubuntu-2604
    image: ubuntu:26.04
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
verifier:
  name: ansible
