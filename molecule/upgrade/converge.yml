---
- name: Converge an older release, then the default tag
  hosts: all
  gather_facts: true
  tasks:
    - name: Install the older release
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        hindsight_image_tag: 0.10.3

    - name: Pull an unrelated image that the upgrade must leave alone
      ansible.builtin.command: podman pull docker.io/library/alpine:3
      changed_when: true

    - name: Create the backup directory
      ansible.builtin.file:
        path: /var/backups/hindsight
        state: directory
        mode: "0700"

    - name: Seed two old backup archives so that rotation has something to remove
      ansible.builtin.copy:
        content: old
        dest: /var/backups/hindsight/{{ item }}
        mode: "0600"
      loop:
        - hindsight-20200101T000000Z-0.0.1.tar
        - hindsight-20200102T000000Z-0.0.2.tar

    - name: Upgrade to the default tag
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
