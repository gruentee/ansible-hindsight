---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    host_path: /srv/hindsight-data
  tasks:
    - name: Readiness endpoint answers
      ansible.builtin.uri:
        url: http://127.0.0.1:8888/health/ready
        status_code: 200

    - name: Stat the host directory
      ansible.builtin.stat:
        path: "{{ host_path }}"
      register: hindsight_verify_dir

    - name: The host directory is owned by 1000:1000
      ansible.builtin.assert:
        that:
          - hindsight_verify_dir.stat.isdir
          - hindsight_verify_dir.stat.uid == 1000
          - hindsight_verify_dir.stat.gid == 1000

    - name: Inspect the container mounts
      ansible.builtin.command: podman inspect hindsight
      register: hindsight_verify_mounts
      changed_when: false

    - name: The host directory is bind-mounted and no named volume is used
      ansible.builtin.assert:
        that:
          - "(hindsight_verify_mounts.stdout | from_json)[0].Mounts | map(attribute='Type') | list == ['bind']"
          - "(hindsight_verify_mounts.stdout | from_json)[0].Mounts[0].Source == host_path"

    - name: Write a marker into the data directory from inside the container
      ansible.builtin.command: podman exec hindsight touch /home/hindsight/.pg0/persist-marker
      changed_when: false

    - name: Read the container ID before recreation
      ansible.builtin.command: podman inspect hindsight
      register: hindsight_verify_id_before
      changed_when: false

    - name: Restart the service to recreate the container  # noqa: no-handler
      ansible.builtin.systemd:
        name: hindsight
        state: restarted

    - name: Readiness endpoint answers after recreation
      ansible.builtin.uri:
        url: http://127.0.0.1:8888/health/ready
        status_code: 200
      register: hindsight_verify_ready_again
      until: hindsight_verify_ready_again.status == 200
      retries: 60
      delay: 5

    - name: Read the container ID after recreation
      ansible.builtin.command: podman inspect hindsight
      register: hindsight_verify_id_after
      changed_when: false

    - name: Read the marker through the new container
      ansible.builtin.command: podman exec hindsight ls /home/hindsight/.pg0/persist-marker
      changed_when: false

    - name: The container was recreated
      ansible.builtin.assert:
        that: (hindsight_verify_id_after.stdout | from_json)[0].Id != (hindsight_verify_id_before.stdout | from_json)[0].Id

    - name: Apply the role with the host path emptied
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        hindsight_data_host_path: ""

    - name: Inspect the container mounts after emptying the path
      ansible.builtin.command: podman inspect hindsight
      register: hindsight_verify_mounts_volume
      changed_when: false

    - name: The named volume is used
      ansible.builtin.assert:
        that:
          - "'\"Type\": \"volume\"' in hindsight_verify_mounts_volume.stdout"
          - "'\"Name\": \"hindsight-data\"' in hindsight_verify_mounts_volume.stdout"
          - "'\"Type\": \"bind\"' not in hindsight_verify_mounts_volume.stdout"

    - name: Service is ready on the named volume
      ansible.builtin.uri:
        url: http://127.0.0.1:8888/health/ready
        status_code: 200
