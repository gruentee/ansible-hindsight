---
# Host-path scenario (#15): Embedded Database on a host directory, Ubuntu 26.04, rootful Podman nested in a systemd container.
# The platforms block follows docs/adr/0001-molecule-with-nested-podman.md.
driver:
  name: docker
platforms:
  - name: ubuntu-2604
    image: ubuntu:26.04
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        hindsight_llm_provider: none
        hindsight_cp_access_key: molecule-secret-sentinel
        hindsight_data_host_path: /srv/hindsight-data
        hindsight_min_free_disk_mb: 0
verifier:
  name: ansible
