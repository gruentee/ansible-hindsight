---
# Image scenario (#18): tag composition from version plus variant. Runs on the controller; no pull.
driver:
  name: default
  options:
    managed: false
platforms:
  - name: localhost
provisioner:
  name: ansible
  inventory:
    host_vars:
      localhost:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
scenario:
  test_sequence:
    - converge
