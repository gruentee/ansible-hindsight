---
# Default scenario (#11): Embedded Database on Debian 12, Ubuntu 22.04, Ubuntu 26.04 and Rocky Linux 9, rootful Podman nested in a systemd container.
# Platform names are unique because Docker container names are global on a shared host.
# The platforms block follows docs/adr/0001-molecule-with-nested-podman.md.
driver:
  name: docker
platforms:
  - name: hs16-debian12
    image: debian:12
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
  - name: hs16-ubuntu2204
    image: ubuntu:22.04
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
  - name: hs16-ubuntu2604
    image: ubuntu:26.04
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
  - name: hs16-rocky9
    image: rockylinux:9
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        hindsight_llm_provider: none
        hindsight_cp_access_key: molecule-secret-sentinel
        hindsight_min_free_disk_mb: 0
verifier:
  name: ansible
